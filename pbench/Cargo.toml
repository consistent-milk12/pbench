[package]
name = "pbench"
version = "0.2.0"
edition = "2024"
description = "Percentile-focused benchmarking for Rust — p50/p95/p99/p99.9/p99.99"
license = "MIT"
repository = "https://github.com/consistent-milk12/pbench"
documentation = "https://docs.rs/pbench"
homepage = "https://github.com/consistent-milk12/pbench"
readme = "../README.md"
keywords = ["benchmark", "percentile", "latency", "performance"]
categories = ["development-tools::profiling"]

[dependencies]
pbench-macros = { version = "0.2.0", path = "../pbench-macros" }
hdrhistogram = "7.5.4"

[dependencies.serde]
version = "1.0.228"
optional = true
features = ["derive"]

[dependencies.serde_json]
version = "1.0.149"
optional = true

[dev-dependencies]
trybuild = "1.0.116"
tempfile = "3.26.0"
scc = "3.6.5"
mimalloc = "0.1.48"
masstree = { version = "0.8.1", features = ["mimalloc"] }
dashmap = "6.1.0"

[features]
default = []
json = ["serde", "serde_json"]

[[bench]]
name = "simple"
harness = false

[[bench]]
name = "with_inputs"
harness = false

[[bench]]
name = "bench_masstree"
harness = false

[[bench]]
name = "bench_scc"
harness = false

[[bench]]
name = "bench_rwlock_btree"
harness = false

[[bench]]
name = "contention_masstree"
harness = false

[[bench]]
name = "contention_scc"
harness = false

[[bench]]
name = "contention_rwlock_btree"
harness = false

[[bench]]
name = "bench_dashmap"
harness = false
