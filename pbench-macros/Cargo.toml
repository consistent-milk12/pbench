[package]
name = "pbench-macros"
version = "0.2.0"
edition = "2024"
description = "Proc macros for the pbench benchmarking framework"
license = "MIT"
repository = "https://github.com/consistent-milk12/pbench"
documentation = "https://docs.rs/pbench-macros"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0.117", features = ["full"] }
quote = "1.0.44"
proc-macro2 = "1.0.106"
